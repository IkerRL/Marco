<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Frame | Twitch Interactive Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="camera-body theme-normal">

    <!-- Contenedor principal del marco de la cámara -->
    <div class="camera-frame">
        <!-- Esquinas decorativas en los 4 lados -->
        <div class="camera-corner top-left"></div>
        <div class="camera-corner top-right"></div>
        <div class="camera-corner bottom-left"></div>
        <div class="camera-corner bottom-right"></div>

        <!-- ==============================================
             ELEMENTOS EXCLUSIVOS DEL TEMA GTA VI
             ============================================== -->
        <div class="gta-decorations">
            <!-- Bruma sutil de atardecer en el borde inferior -->
            <div class="gta-sunset-glow"></div>

            <!-- Partículas sutiles de neón flotantes en los bordes -->
            <div class="gta-particles">
                <span class="particle p1"></span>
                <span class="particle p2"></span>
                <span class="particle p3"></span>
                <span class="particle p4"></span>
                <span class="particle p5"></span>
                <span class="particle p6"></span>
            </div>

            <!-- Palmeras Tropicales Izquierda (Silueta doble realista con contraluz neón) -->
            <div class="gta-palm-group gta-palm-left">
                <!-- Palmera principal alta -->
                <svg class="palm-svg palm-main" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="palmSilLeft" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2b0938" />
                            <stop offset="55%" stop-color="#140421" />
                            <stop offset="100%" stop-color="#090212" />
                        </linearGradient>
                    </defs>
                    <!-- Tronco curvado orgánico -->
                    <path fill="url(#palmSilLeft)"
                        d="M 52 260 C 66 205 78 148 70 92 C 69 89 75 88 77 92 C 88 148 78 205 66 260 Z" />
                    <!-- Frondas detalladas con puntas plumosas -->
                    <path fill="url(#palmSilLeft)"
                        d="M 73 91 C 52 72 28 70 4 86 C 18 76 28 75 34 78 C 22 83 14 91 8 100 C 26 86 48 84 71 93 Z" />

                    <path fill="url(#palmSilLeft)"

                    <path fill="url(#palmSilLeft)"
                        d="M 76 89 C 110 58 144 54 176 66 C 154 60 140 62 130 67 C 148 68 162 75 174 86 C 144 72 110 72 76 91 Z" />
                    <path fill="url(#palmSilLeft)"
                        d="M 76 91 C 112 78 142 90 166 116 C 148 102 134 98 122 98 C 138 106 148 118 154 132 C 132 108 104 94 75 93 Z" />
                    <path fill="url(#palmSilLeft)"
                        d="M 74 93 C 96 98 114 118 124 146 C 112 128 100 118 90 114 C 102 126 108 140 110 154 C 98 126 84 106 73 94 Z" />
                </svg>
                <!-- Palmera secundaria más pequeña -->
                <svg class="palm-svg palm-secondary" viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg">
                    <path fill="url(#palmSilLeft)"
                        d="M 38 200 C 52 160 66 122 82 86 C 84 83 88 85 87 88 C 72 124 60 162 48 200 Z" />
                    <path fill="url(#palmSilLeft)" d="M 84 86 C 64 70 42 70 20 82 C 38 76 58 78 82 88 Z" />

                    <path fill="url(#palmSilLeft)" d="M 86 88 C 112 86 134 102 146 126 C 128 106 108 94 85 90 Z" />
                </svg>
            </div>

            <!-- Palmeras Tropicales Derecha (Silueta doble realista con contraluz neón) -->
            <div class="gta-palm-group gta-palm-right">
                <!-- Palmera principal alta -->
                <svg class="palm-svg palm-main" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="palmSilRight" x1="100%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#2b0938" />
                            <stop offset="55%" stop-color="#140421" />
                            <stop offset="100%" stop-color="#090212" />

                    <!-- Tronco curvado orgánico -->
                    <path fill="url(#palmSilRight)"

                <!-- Palmera secundaria más pequeña -->
                <svg class="palm-svg palm-secondary" viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg">
                    <path fill="url(#palmSilRight)"
                        d="M 122 200 C 108 160 94 122 78 86 C 76 83 72 85 73 88 C 88 124 100 162 112 200 Z" />

                </svg>
            </div>

            <!-- Líneas de atardecer en la base -->
            <div class="gta-sunset-lines">
                <div class="sunset-bar bar-1"></div>
                <div class="sunset-bar bar-2"></div>
                <div class="sunset-bar bar-3"></div>
            </div>
        </div>
    </div>

    <!-- Scripts de configuración y conexión Twitch IRC -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
